<style>:root{--bg:#fdf4f0;--card:#ffffff;--ink:#5a3e38;--muted:#8f6f67;--acc:#e89bb0;--acc-deep:#a4566e;--ok:#d9a3b5;--line:#f0d5cc;--tint:#fbe5e9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.6 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:40px 22px 64px}
h1,h3,.lbl{font-family:"Quicksand","Nunito",system-ui,sans-serif;font-weight:700;line-height:1.2;margin:0 0 12px;color:var(--acc-deep)}h1{font-size:clamp(34px,9vw,46px)}h3{font-size:21px;margin-bottom:8px;color:var(--ink)}
p{margin:0 0 14px}.muted{color:var(--muted)}
.lbl{font-size:15px;text-transform:uppercase;letter-spacing:.08em;margin:6px 0 6px}
input{width:100%;font:700 19px "Nunito",system-ui,sans-serif;letter-spacing:.08em;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px;text-transform:uppercase}
.btn{display:block;width:100%;background:var(--acc);color:#4a2a2f;border:0;border-radius:18px;font:800 18px "Nunito",system-ui,sans-serif;padding:15px 20px;min-height:52px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 4px 0 #cf8197}
.btn.alt{background:var(--card);color:var(--acc-deep);border:2px solid var(--line);box-shadow:none;margin-top:12px}
.back{background:none;border:0;color:var(--muted);font:700 16px "Nunito",sans-serif;padding:14px 0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.err{color:var(--acc-deep);font-weight:800;min-height:24px;margin:0 0 8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}.sum div{background:var(--tint);border-radius:18px;padding:12px 8px;text-align:center}.sum span{display:block;font-size:14px;color:var(--muted);font-weight:700}.sum b{font-size:19px;font-family:"Quicksand",sans-serif}
.choices{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}.choices li{background:var(--tint);border-radius:14px;padding:8px 12px;font-weight:700}.choices span{color:var(--acc-deep);font-size:14px;margin-right:6px}
.info{margin:10px 0 4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px dashed var(--line)}
.note{background:var(--tint);color:var(--ink);border-radius:14px;padding:10px 14px;margin:10px 0 0;font-weight:700;font-size:16px}
.st{list-style:none;margin:0;padding:0}.st li{position:relative;padding:6px 0 6px 32px;color:var(--muted);font-size:16px;font-weight:600}
.st li::before{content:"";position:absolute;left:0;top:11px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.st li.done{color:var(--ink)}.st li.done::before{background:var(--ok);border-color:var(--ok)}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function php(n){return "₱"+Number(n||0).toLocaleString("en-PH")}
function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function hex(u){return Array.prototype.map.call(u,function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function openCode(code){var te=new TextEncoder(),m=await crypto.subtle.importKey("raw",te.encode(code),"PBKDF2",false,["deriveBits"]);
 var bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:te.encode("pb-v1"),iterations:100000,hash:"SHA-256"},m,384));
 var e=TR.filter(function(x){return x.h==hex(bits.slice(0,8))})[0];if(!e)return null;
 var key=await crypto.subtle.importKey("raw",bits.slice(16,48),"AES-GCM",false,["decrypt"]),u=b2u(e.w);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12))))}
async function go(){var el=document.getElementById("err"),code=(document.getElementById("code").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 if(code.length<10){el.textContent="Enter your 10-character access code.";return}

 try{var d=await openCode(code);if(!d){el.textContent="That code doesn’t match. Check it and try again.";return}show(d)}catch(x){el.textContent="Couldn’t open that code. Check it and try again."}}
